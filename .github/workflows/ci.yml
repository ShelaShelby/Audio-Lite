name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The runner has no sound card: these tests cover the logic, not real audio.
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size
        shell: bash
        run: |
          size=$(wc -c < target/release/audio-lite.exe)
          echo "audio-lite.exe: $size bytes"
          echo "### Binary size: $size bytes" >> "$GITHUB_STEP_SUMMARY"
      # Memory check: open and hide the window 300 times and print PrivateUsage and
      # WorkingSetSize at 0, 75, 150 and 300 cycles and 3 s after the last hide.
      # Fails if the 300 cycles do not finish.
      - name: Cycle test (window open/hide x300, memory)
        timeout-minutes: 15
        shell: bash
        run: |
          summary() { { echo "### Cycle test, $1"; echo '```'; cat "$2"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
          ./target/release/audio-lite.exe --cycle-test 300 || echo "exit code $?"
          touch cycle-test.log && cat cycle-test.log && summary "Windows OpenGL" cycle-test.log
          # The runner has no GPU. If no window could be made, try Mesa's software OpenGL.
          if ! grep -q "cycle 300" cycle-test.log; then
            curl -sSfL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.2.5/mesa3d-24.2.5-release-msvc.7z
            mkdir -p mesa && 7z e -y -omesa mesa.7z 'x64/*.dll' > /dev/null
            cp target/release/audio-lite.exe mesa/
            cd mesa
            GALLIUM_DRIVER=llvmpipe ./audio-lite.exe --cycle-test 300 || echo "exit code $?"
            touch cycle-test.log && cat cycle-test.log && summary "Mesa llvmpipe (software OpenGL)" cycle-test.log
          fi
          grep -q "+3 s idle" cycle-test.log || { echo "cycle test did not finish"; exit 1; }
