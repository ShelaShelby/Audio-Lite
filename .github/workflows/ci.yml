name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The runner has no sound card: these tests cover the logic, not real audio.
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size
        shell: bash
        run: |
          size=$(wc -c < target/release/audio-lite.exe)
          echo "audio-lite.exe: $size bytes"
          echo "### Binary size: $size bytes" >> "$GITHUB_STEP_SUMMARY"
      # Memory and timing check: from the tray process, start the window
      # process, show and hide it, let it exit, 100 times: 50 cold starts (the
      # click starts it) and 50 warm ones (started as the pointer over the
      # icon would, painted hidden, then clicked); then 3 warm ones without a
      # click must exit by themselves. Prints the tray's PrivateUsage and
      # WorkingSetSize at the start (idle), 25, 50 and 100 cycles and 3 s later,
      # and the median and largest time from "start window process" to its
      # first painted frame and from the click to the window on screen, for
      # cold and warm starts. The app itself fails the test (no
      # "cycle-test: PASS") if the tray grew by more than 1 MB, a window
      # process is left over, or a warm window takes more than 150 ms (median)
      # to show; the runner has no GPU, so the cold numbers are for
      # information only. It also fails if the test does not finish.
      - name: Cycle test (cold and warm start/show/hide/exit x100, memory, timing)
        timeout-minutes: 20
        shell: bash
        run: |
          summary() { { echo "### Cycle test, $1"; echo '```'; cat "$2"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
          ./target/release/audio-lite.exe --cycle-test 100 || echo "exit code $?"
          touch cycle-test.log && cat cycle-test.log && summary "Windows OpenGL" cycle-test.log
          # The runner has no GPU. If no window could be made, try Mesa's software OpenGL.
          if grep -q "cycle-test: the window did not open" cycle-test.log; then
            curl -sSfL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.2.5/mesa3d-24.2.5-release-msvc.7z
            mkdir -p mesa && 7z e -y -omesa mesa.7z 'x64/*.dll' > /dev/null
            cp target/release/audio-lite.exe mesa/
            cd mesa
            GALLIUM_DRIVER=llvmpipe ./audio-lite.exe --cycle-test 100 || echo "exit code $?"
            touch cycle-test.log && cat cycle-test.log && summary "Mesa llvmpipe (software OpenGL)" cycle-test.log
          fi
          grep -q "+3 s idle" cycle-test.log || { echo "cycle test did not finish"; exit 1; }
          { echo "### Timing"; echo '```'; grep "ms (" cycle-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          grep -q "cycle-test: PASS" cycle-test.log || { echo "cycle test failed"; exit 1; }
      # Stress test: 200 times, click the tray icon or move the pointer over it
      # (1 to 3 times in a row: cold and warm starts, clicks while a warm
      # process gets ready, clicks on a shown or exiting window), wait a random
      # time (the window process is starting, painting, warm, shown, hidden or
      # exiting), sometimes hide it, then kill the window process. Fails if the
      # tray dies, a window process is left over, or the tray holds more than
      # 10 handles more than after round 5.
      - name: Stress test (warm and cold starts, kill at random times x200, handles)
        timeout-minutes: 30
        shell: bash
        run: |
          if [ -f mesa/audio-lite.exe ]; then cd mesa; exe=./audio-lite.exe; else exe=./target/release/audio-lite.exe; fi
          rm -f cycle-test.log
          "$exe" --stress-test 200 || echo "exit code $?"
          touch cycle-test.log && cat cycle-test.log
          { echo "### Stress test"; echo '```'; cat cycle-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "stress-test: PASS" cycle-test.log || { echo "stress test failed"; exit 1; }
          sleep 2
          if tasklist //FI "IMAGENAME eq audio-lite.exe" | grep -qi "audio-lite"; then
            echo "audio-lite.exe is still running"; tasklist //FI "IMAGENAME eq audio-lite.exe"; exit 1
          fi
