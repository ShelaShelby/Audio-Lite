[package]
name = "audio-lite"
version = "0.2.0"
edition = "2021"
description = "Tiny Windows tray app: one hotkey cycles the default audio playback device, plus a volume mixer."
license = "MIT"
repository = "https://github.com/ShelaShelby/Audio-Lite"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
# The windows crate's #[interface] and #[implement] macros refer to windows_core by name.
windows-core = "=0.58.0"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Small: no unwinding (nothing catches a panic), one codegen unit, stripped.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
